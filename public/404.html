<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <script>
      (function () {
        var requestedPath = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?redirect=' + encodeURIComponent(requestedPath));
      })();
    </script>
  </head>
  <body></body>
</html>
